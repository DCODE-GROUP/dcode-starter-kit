name: Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-ci:
    uses: ./.github/workflows/ci.yml

  call-workflow-tests:
    uses: ./.github/workflows/run-tests.yml
