name: Bug Report
description: Report something that is not working as expected.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example you can.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the PHP, Laravel, starter kit, and relevant frontend versions.
    validations:
      required: true
