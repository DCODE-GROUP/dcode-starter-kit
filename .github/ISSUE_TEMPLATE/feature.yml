name: Feature Request
description: Suggest an improvement to the starter kit.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Dcode Starter Kit. Please describe the reusable application capability you need.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve, and who experiences it?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behaviour or API you would like the package to provide.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any existing workaround or alternative approach.
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note Laravel, PHP, frontend, tenancy, or private dependency constraints.
    validations:
      required: false
